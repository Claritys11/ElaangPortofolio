# Same shape as the previous deployment: one service, an existing PostgreSQL reached via DATABASE_URL,
# and uploads bind-mounted from ./public/uploads so files from the old site carry over.
# Set these variables in Coolify (Environment Variables) or a .env file next to this file.
services:
  portfolio:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      # At least 32 characters: openssl rand -base64 48
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET}
      SITE_URL: ${SITE_URL:-https://claritys.web.id}
      # Reverse proxies in front of the app (Coolify/Traefik = 1; add 1 for Cloudflare).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    volumes:
      - ./public/uploads:/app/public/uploads
    # Traefik reaches the container over the Docker network; the host port is localhost-only so
    # nobody can bypass the proxy (the rate limiter trusts the proxy's X-Forwarded-For hop).
    ports:
      - "127.0.0.1:3015:3000"
