# Same shape as the previous deployment: one service, an existing PostgreSQL reached via DATABASE_URL,
# and uploads bind-mounted from ./public/uploads so files from the old site carry over.
# Set these variables in Coolify (Environment Variables) or a .env file next to this file.
services:
  portfolio:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      # At least 32 characters: openssl rand -base64 48
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET}
      SITE_URL: ${SITE_URL:-https://claritys.web.id}
      # Behind Cloudflare the client IP comes from CF-Connecting-IP; this only matters without it.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    volumes:
      - ./public/uploads:/app/public/uploads
    # cloudflared on the host forwards claritys.web.id -> http://localhost:3020.
    # Localhost-only so nobody can bypass the tunnel (the rate limiter trusts Cloudflare's headers).
    ports:
      - "127.0.0.1:3020:3000"
