name: Deploy static portfolio to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Refresh the build-time GitHub contribution snapshot daily, away from the hour boundary.
    - cron: "23 9 * * *"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate content
        run: pnpm verify:content

      - name: Build static site
        run: pnpm build

      - name: Verify exported files
        run: pnpm verify:output

      - name: Install Playwright Chromium
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        if: github.event_name == 'pull_request'
        run: pnpm e2e

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
