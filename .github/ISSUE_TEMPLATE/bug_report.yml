name: Bug report
description: Report a reproducible problem.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node.js, pnpm, deployment context, and relevant configuration.
    validations:
      required: false
  - type: checkboxes
    id: security
    attributes:
      label: Security Check
      options:
        - label: This is not a security-sensitive vulnerability report.
          required: true
